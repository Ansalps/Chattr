name: Build and Deploy to GKE

on:
  push:
    branches: [ "Notification" ]

env:
  PROJECT_ID: "project-7559c875-60a6-4d6a-b57"
  GKE_CLUSTER: "chattr-standard"
  GKE_ZONE: "us-central1-a"
  # Replace with your Docker Hub details
  DOCKER_USER: "ansalps" 
  IMAGE_NAME: "chattr-not_svc"
  # Replace 'github-provider' if you named yours differently in your pool
  WIF_PROVIDER: "projects/18338518815/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  SERVICE_ACCOUNT: "github-deployer@project-7559c875-60a6-4d6a-b57.iam.gserviceaccount.com"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Login to Docker Hub (Uses GitHub Secrets)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 2. Build and Push Docker Image
    # Using the GitHub SHA ensures the image tag is unique, forcing K8s to pull the new version
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./Notification_Service  # Ensure this matches your folder name
        push: true
        tags: |
          ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # 3. Authenticate with Google Cloud using WIF
    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    # 4. Get GKE Credentials
    - name: Set up GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    # 5. Deploy to Kubernetes
    # We update the deployment image to the specific SHA tag we just built
    - name: Deploy to GKE
      run: |
        kubectl set image deployment/notification-service \
          notification-service=${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        kubectl rollout status deployment/notification-service
