# 2. THE SECRET (Private/Sensitive Settings)
# Note: In a real production git repo, you usually don't hardcode these.
# For local 'kind' development, it's fine to keep them here for now.
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData: # stringData allows plain text; K8s encodes it to base64 automatically
  DB_USER: ""
  DB_PASSWORD: ""
  USER_SECURITY_KEY: ""
  ADMIN_SECURITY_KEY: ""
  OTPVERIFICATION_SECURITY_KEY: ""
  RESET_PASSWORD_SECURITY_KEY: ""
  ADMIN_REFRESH_KEY: ""
  USER_REFRESH_KEY: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  SMTP_SENDER: ""
  SMTP_APPKEY: ""
  AWS_ACCESS_KEY: ""
  AWS_SECRET_ACCESS_KEY: ""

---