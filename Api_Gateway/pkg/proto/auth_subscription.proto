syntax="proto3";
package auth_subscription;
option go_package="./pkg/pb/auth_subscription";
import "google/protobuf/timestamp.proto";
service AuthSubscriptionService{
    rpc AdminLogin(AdminLoginRequest) returns (AdminLoginResponse);
    rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
    rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);
    rpc GetAllUsers(GetAllUsersRequest) returns (GetAllUsersResponse);
    rpc CreateSubscriptionPlan(CreateSubscriptionPlanRequest) returns (CreateSubscriptionPlanResponse);
    rpc ActivateSubscriptionPlan(ActivateSubscriptionPlanRequest) returns (ActivateSubscriptionPlanResponse);
    rpc DeactivateSubscriptionPlan(DeactivateSubscriptionPlanRequest) returns (DeactivateSubscriptionPlanResponse);
    rpc GetAllSubscriptionPlans(GetAllSubscriptionPlansRequest) returns (GetAllSubscriptionPlansResponse);

    rpc UserSignUp(UserSignUpRequest) returns (UserSignUpResponse);
    rpc VerifyOtp(OtpRequest) returns (OtpVerificationResponse);
    rpc ResendOtp(ResendOtpRequest) returns (ResendOtpResponse);
    rpc AccessRegenerator(AccessRegeneratorRequest) returns (AccessRegeneratorResponse);
    rpc ForgetPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
    rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
    rpc UserLogin(UserLoginRequest) returns (UserLoginResponse);
    rpc GetAllActiveSubscriptionPlans(GetAllActiveSubscriptionPlansRequest) returns (GetAllActiveSubscriptionPlansResponse);
    rpc Subscribe(SubscribeReqeust) returns (SubscribeResponse);
    rpc VerifySubscriptionPayment(VerifySubscriptionPaymentRequest) returns (VerifySubscriptionPaymentResponse);
    rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
    rpc SetProfileImage(SetProfileImageRequest) returns (SetProfileImageResponse);
    rpc Webhook(WebhookRequest) returns (WebhookResponse);

    rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

    rpc GetProfileInformation(ProfileInfoReq) returns (ProfileInfoRes);
    rpc EditProfileInfromation(EditProfileReq) returns (EditProfileRes);

    rpc SearchUser(SearchUserRequest) returns (SearchUserResponse);
    rpc UserPublicData(UserPublicDataRequest) returns (UserPublicDataResponse);

    rpc GetSubscriptionDetails(GetSubscriptionDetailsRequest) returns (GetSubscriptionDetailsResponse);

    rpc WebhookSubscriptionActivated(WebhookSubscriptionActivatedRequest) returns (WebhookSubscriptionActivatedResponse);

    rpc WebhookSubscriptionCharged(WebhookSubscriptionChargedRequest) returns (WebhookSubscriptionChargedResponse);

    rpc WebhookSubscriptionHalted(WebhookSubscriptionHaltedRequest) returns (WebhookSubscriptionHaltedResponse);

    rpc WebhookSubscriptionCancelled(WebhookSubscriptionCancelledRequest) returns (WebhookSubscriptionCancelledResponse);

    rpc WebhookSubscriptionCompleted(WebhookSubscriptionCompletedRequest) returns (WebhookSubscriptionCompletedResponse);
}
message WebhookSubscriptionCompletedRequest{
    string RazorpaySubscriptionId=1;
    string Status=2;
    uint64 UserId=4;
}
message WebhookSubscriptionCompletedResponse{
    string RazorpaySubscriptionId=1;
}
message WebhookSubscriptionCancelledRequest{
    string RazorpaySubscriptionId=1;
    string Status=2;
    google.protobuf.Timestamp CancelledAt=3;
    uint64 UserId=4;
}
message WebhookSubscriptionCancelledResponse{
    string RazorpaySubscriptionId=1;
}
message WebhookSubscriptionHaltedRequest{
    string RazorpaySubscriptionId=1;
    string Status=2;
    uint64 UserId=3;
}
message WebhookSubscriptionHaltedResponse{
    string RazorpaySubscriptionId=1;
}
message WebhookSubscriptionChargedRequest{
    string RazorpaySubscriptionId=1;
    string RazorpayPlanId=2;
    google.protobuf.Timestamp NextChargeAt=3;
    int64 PaidCount=4;
    int64 RemainingCount=5;
    string InvoiceId=6;
    int64 Amount=7;
    string Currency=8;
    string Method=9;
    string Status=10;
    google.protobuf.Timestamp TransactionDate=11;
    string PaymentId=12;
    uint64 UserId=13;
}
message WebhookSubscriptionChargedResponse{
    string RazorpaySubscriptionId=1;
}
message WebhookSubscriptionActivatedRequest{
    string RazorpaySubscriptionId=1;
    string Status=2;
    int64 PaidCount=3;
    int64 RemainingCount=4;
    google.protobuf.Timestamp StartAt=5;
    google.protobuf.Timestamp EndAt=6;
    uint64 UserId=7;
}
message WebhookSubscriptionActivatedResponse{
    string RazorpaySubscriptionId=1;
}
message SubscriptionPlan{
    uint64 Id=1;
    google.protobuf.Timestamp CreatedAt = 2;
    google.protobuf.Timestamp UpdatedAt = 3;
    string RazorpayPlanId=4;
    string Name=5;
    int64 Price=6;
    string Currency=7;
    string Period=8;
    uint64 Interval=9;
    string Description=10;
    bool IsActive=11;
}
message GetSubscriptionDetailsRequest{
    uint64 UserId=1;
   // uint64 SubId=2;
}
message GetSubscriptionDetailsResponse{
    SubscriptioPlan subsciptionPlan=1;
    uint64 UserId=2;
    uint64 SubscriptionId=3;
    //uint64 SubscriptionPlanId=3;
    google.protobuf.Timestamp CreatedAt=4;
    google.protobuf.Timestamp UpdatedAt=5;
    string RazorpaySubscriptionId=6;
    //string RazorpayPlanId=7;
    string Status=7;
    string ShortUrl=8;
    google.protobuf.Timestamp StartAt=9;
    google.protobuf.Timestamp EndAt=10;
    google.protobuf.Timestamp NextChargeAt=11;
    int64 TotalCount=12;
    int64 RemainingCount=13;
    int64 PaidCount=14;
    google.protobuf.Timestamp CancelledAt=15;
    string CancelReason=16;

}
message UserPublicDataRequest{
    uint64 UserId=1;
}
message UserPublicDataResponse{
    uint64 UserId=1;
    string UserName=2;
    string Name=3;
    string ProfileImgUrl=4;
    string Bio=5;
    string Links=6;
    bool BlueTick=7;
}   
message SearchUserRequest{
    string SearchText=1;
    int64 Limit=2;
    int64 Offset=3;
}
message UserMetaData{
    uint64 UserId=1;
    string UserName=2;
    string Name=3;
    string ProfileImgUrl=4;
}
message SearchUserResponse{
    repeated UserMetaData userMetaData=1;
}
message ChangePasswordRequest{
    uint64 UserId=1;
    string OldPassword=2;
    string NewPasswrod=3;
    string ConfirmNewPassword=4;
}
message ChangePasswordResponse{
    uint64 UserId=1;
}
message EditProfileReq{
    uint64 UserId=1;
    optional string Name=2;
    optional string Bio=3;
    optional string Links=4;
    optional string Phone=5;
}
message EditProfileRes{
    uint64 UserId=1;
    optional string Name=2;
    optional string Bio=3;
    optional string Links=4;
}
message ProfileInfoReq{
    uint64 UserId=1; 
}
message ProfileInfoRes{
    uint64 UserId=1;
    string Name=2;
    string Username=3;
    string Email=4;
    string Bio=5;
    string ProfileImageUrl=6;
    string Links=7;
    bool BlueTick=8;
    string Phone=9;
}
message WebhookRequest {
    string event = 1;
    Payload payload = 2;
}
message Payload {
    Subscription subscription = 1;
}
message Subscription {
    string id = 1;
    string email = 2; // Add this to identify the user
}

message WebhookResponse{
    string Event=1;
    string RazorpaySubscriptionId=2;
}
message SetProfileImageRequest{
    uint64 UserId=1;
    string ContentType=2;
    bytes Image=3;
}
message SetProfileImageResponse{
    string ImageUrl=1;
}
message UnsubscribeRequest{
   // uint64 SubId=1;
   uint64 UserId=1;
    string CancelReason =2;
    bool CancelAtCycleEnd=3;
}
message UnsubscribeResponse{
    uint64 SubId=1;
}
