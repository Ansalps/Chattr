<html>
  <body>
      <button id="rzp-button">Authenticate</button>
      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
      <script>
        var options = {
          "key": "{{.KeyID}}",
          "subscription_id": "{{.SubscriptionID}}",
          "name": "Chattr",
          "description": "blue tick monthly subscription",
          "handler": function (response){
            // 1. Log the entire object for inspection
            console.log("--- RAZORPAY FULL RESPONSE ---");
            console.log(response);
            
            // 2. Log as a table to clearly see keys and values
            console.table(response);

            // 3. Alert the specific fields found
            let msg = "Fields received:\n";
            for (let key in response) {
                msg += key + ": " + response[key] + "\n";
            }
            alert(msg);

            // For now, we stop here so you can look at the console.
            console.log("Check if 'razorpay_order_id' or 'razorpay_subscription_id' is present.");
          }
        };
        var rzp1 = new Razorpay(options);
        document.getElementById('rzp-button').onclick = function(e){
          rzp1.open();
        }
      </script>
  </body>
</html>
